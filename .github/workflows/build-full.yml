name: 完整 CI/CD (Full Build & Release)

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 第一步：代码检查和测试
  test:
    runs-on: macos-latest
    name: Test on Python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python3 test_self.py

      - name: Run integration tests (if display available)
        run: python3 test_meowser_load.py || echo "Display not available, skipping"
        continue-on-error: true

  # 第二步：代码质量检查 (可选)
  lint:
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          python -m py_compile *.py

  # 第三步：打包构建
  build:
    runs-on: macos-latest
    needs: test
    if: always()
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS app
        run: |
          chmod +x ./build.sh
          ./build.sh
        env:
          ARCHFLAGS: -arch arm64

      - name: Verify build
        run: |
          if [ -f "dist/Meowser-*.zip" ]; then
            echo "✅ Build successful"
            ls -lh dist/
          else
            echo "❌ Build failed"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: meowser-macos-${{ matrix.arch }}
          path: dist/Meowser-*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload app binary
        uses: actions/upload-artifact@v3
        with:
          name: Meowser.app-${{ matrix.arch }}
          path: dist/Meowser.app
          retention-days: 7

  # 第四步：发布 Release
  release:
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -name "Meowser-*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")
          if [ "$PREVIOUS_TAG" != "HEAD" ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            git log $PREVIOUS_TAG..HEAD --oneline --decorate >> $GITHUB_OUTPUT || true
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/Meowser-*.zip
          body: |
            ## 发布说明 (Release Notes)

            ### 构建信息 (Build Info)
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}
            - 运行器: macOS latest (Apple Silicon)

            ### 安装 (Installation)
            1. 下载 `Meowser-vX.Y.Z.zip`
            2. 解压后双击 `打开.command`
            3. 按照提示选择工作区

            ### 更新日志 (Changelog)
            ${{ steps.changelog.outputs.changelog || 'See commits for details' }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 第五步：通知
  notify:
    runs-on: macos-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Build status
        run: |
          echo "✅ 构建完成"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
